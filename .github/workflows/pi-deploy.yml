name: Build Salesagent

on:
  workflow_dispatch:
    inputs:
      salesagent-branch:
        default: main
      image-tag:
        default: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for GHCR
    steps:
      - uses: actions/checkout@v7
        with:
          repository: postindustria-tech/salesagent
          ref: ${{ inputs.salesagent-branch }}

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/postindustria-tech/salesagent:${{ inputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
